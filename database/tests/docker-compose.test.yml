version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: smartdining-postgres-test
    environment:
      POSTGRES_DB: smartdining_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ../scripts:/smartdining-db/scripts:ro
      - ../seed.sql:/smartdining-db/seed.sql:ro
      - ../schema.sql:/smartdining-db/schema.sql:ro
      - ../docker-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdining_test"]
      interval: 3s
      timeout: 3s
      retries: 10
