# Cabeceras comunes a todos los sitios HTTPS (se incluyen dentro de cada server).
# "always": también en respuestas de error (4xx/5xx).

# Solo HTTPS durante 1 año, también en los subdominios. No se pide "preload"
# hasta tener el dominio definitivo (es difícil de revertir).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# El navegador no "adivina" el tipo de un archivo (evita ejecutar un JSON como script).
add_header X-Content-Type-Options "nosniff" always;
# Las URLs con ?token=... del QR no se filtran a otros sitios en el Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
