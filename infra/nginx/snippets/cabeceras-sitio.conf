# Cabeceras de un sitio estático (app., staff., cocina.): las comunes de
# seguridad.conf más su CSP, que cada server define en $csp. La CSP va en una
# variable porque lleva ${DOMINIO}, que solo se sustituye en templates/.
#
# OJO: nginx NO hereda los add_header del server en un location que tenga los
# suyos (Cache-Control, por ejemplo). Por eso este snippet se incluye en el
# server Y en cada location con add_header: si no, ese location se queda sin
# CSP, HSTS, nosniff, Referrer-Policy y Permissions-Policy.
include /etc/nginx/snippets/seguridad.conf;
add_header Content-Security-Policy $csp always;
