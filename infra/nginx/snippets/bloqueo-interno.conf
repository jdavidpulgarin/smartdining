# /internal/* es SOLO servidor a servidor (backend <-> socket-server por la red
# interna de Docker). Desde Internet no existe: ni siquiera se le pasa la
# petición al servicio, así una INTERNAL_API_KEY filtrada no sirve desde fuera.
location ^~ /internal/ {
    deny all;
    return 404;
}
location ^~ /api/internal/ {
    deny all;
    return 404;
}
