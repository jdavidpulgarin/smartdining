# SmartDining — servicios de DESARROLLO local (PostgreSQL + Redis).
#
# El backend y el socket-server corren en tu máquina con `npm run dev`; aquí solo
# se levantan sus dependencias. Producción usa docker-compose.prod.yml.
#
#   docker compose up -d          # levantar
#   docker compose ps             # ver estado (healthy)
#   docker compose down           # detener (los datos quedan en los volúmenes)
#   docker compose down -v        # detener y BORRAR los datos (vuelve a correr los scripts)
#
# Los puertos se publican solo en 127.0.0.1: nadie de tu red Wi-Fi llega a la
# base ni a Redis, aunque uses las credenciales de desarrollo.

name: smartdining

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartdining}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Solo desarrollo: coincide con backend/.env.example. Cámbiala en el .env raíz si quieres.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: el carrito, la idempotencia y las revocaciones de QR que guarda
    # el socket-server sobreviven a un reinicio del contenedor.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
